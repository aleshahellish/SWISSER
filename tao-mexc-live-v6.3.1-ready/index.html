<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAO MEXC Live</title><style>:root{color-scheme:light dark;font-family:Arial,sans-serif}body{max-width:1100px;margin:auto;padding:24px;line-height:1.45}.p{border:1px solid #7775;border-radius:14px;padding:18px;margin-bottom:18px}.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.x{border:1px solid #7774;border-radius:10px;padding:12px}.v{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #7774;text-align:left;white-space:nowrap}.w{overflow-x:auto}.mut{opacity:.72}.err{border-color:#c66}button{padding:10px 14px;cursor:pointer}</style></head><body><section class="p"><h1>TAO_USDT — MEXC Futures</h1><p>Candle 2 / Candle 3 v6.3, Reversal Filter 12, Wick Threshold 40%.</p><button id="r">Обновить</button> <a href="/api/snapshot_v6">JSON для анализа</a></section><section class="p" id="s">Загрузка…</section><div id="c"></div><script>
const e=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function rows(a){return a?.length?a.slice(-8).reverse().map(x=>`<tr><td>${e(x.time_utc)}</td><td>${e(x.direction)}</td><td>${e(x.open)}</td><td>${e(x.high)}</td><td>${e(x.low)}</td><td>${e(x.close)}</td></tr>`).join(''):'<tr><td colspan="6">Нет сигналов</td></tr>'}
function tab(t,a){return `<h3>${t}</h3><div class="w"><table><thead><tr><th>Время UTC</th><th>Направление</th><th>O</th><th>H</th><th>L</th><th>C</th></tr></thead><tbody>${rows(a)}</tbody></table></div>`}
function tf(n,d){let l=d.latest_live_candle||{};return `<section class="p"><h2>${n}</h2><p><b>Текущая свеча:</b> ${e(l.time_utc)} — O ${e(l.open)}, H ${e(l.high)}, L ${e(l.low)}, C ${e(l.close)}</p>${tab('Последние Candle 2',d.recent_candle2)}${tab('Последние Candle 3',d.recent_candle3)}</section>`}
async function load(){let s=document.getElementById('s'),c=document.getElementById('c');s.className='p';s.textContent='Загрузка актуальных данных MEXC…';c.innerHTML='';try{let r=await fetch('/api/snapshot_v6?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Ошибка');s.innerHTML=`<div class="m"><div class="x"><div class="mut">Цена</div><div class="v">${e(d.current_price)}</div></div><div class="x"><div class="mut">High 24ч</div><div class="v">${e(d.high_24h)}</div></div><div class="x"><div class="mut">Low 24ч</div><div class="v">${e(d.low_24h)}</div></div><div class="x"><div class="mut">Обновлено</div><div class="v">${e(d.fetched_at_utc)}</div></div></div>`;c.innerHTML=tf('15m',d.timeframes['15m'])+tf('1h',d.timeframes['1h'])}catch(x){s.className='p err';s.textContent='Ошибка: '+x.message}}
document.getElementById('r').onclick=load;load();
</script></body></html>
